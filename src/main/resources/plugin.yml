name: WordChain
version: 1.3.0
main: com.example.wordchain.WordChainPlugin
api-version: '26.2'
description: Vietnamese word-chain game with public chat rounds, private duels, rewards, and leaderboard.
libraries:
  - org.xerial:sqlite-jdbc:3.49.1.0
commands:
  wordchain:
    description: Word-chain game controls and menu
    usage: /wordchain <start|stop|reset|vote|menu|top|wins|rewards|reward|difficulty|duel|accept|deny|add|remove|report|reports|approve|reject|import|reload>
    aliases: [wc, noitu]
permissions:
  wordchain.player:
    description: Basic WordChain commands for regular players
    default: true
    children:
      wordchain.play: true
      wordchain.menu: true
      wordchain.top: true
      wordchain.duel: true
      wordchain.duel.respond: true
      wordchain.report: true
      wordchain.vote: true
  wordchain.play:
    description: Start, stop, and reset the word-chain game
    default: true
  wordchain.menu:
    description: Open the player game menu
    default: true
  wordchain.top:
    description: View the public wins leaderboard
    default: true
  wordchain.duel:
    description: Challenge another player to a duel
    default: true
  wordchain.duel.respond:
    description: Accept or deny a duel invitation
    default: true
  wordchain.report:
    description: Report missing Vietnamese phrases
    default: true
  wordchain.vote:
    description: Vote on public game reset proposals
    default: true
  wordchain.admin:
    description: Manage words, reports, dictionary imports, and configuration
    default: op
  wordchain.rewards:
    description: Edit reward item types and amounts
    default: op
  wordchain.stats:
    description: View player win and streak statistics
    default: op
