game:
  target-moves: 10
  # Players can use start/stop/reset by default; set false to restrict controls to admins.
  members-can-control: true
  max-phrase-length: 48
  next-match-delay-seconds: 5
  recent-start-limit: 20
  reset-vote-seconds: 30
rewards:
  # Bukkit material names and positive integer amounts. Invalid entries are skipped with a warning.
  items:
    - "DIAMOND:3"
    - "EMERALD:5"
  economy:
    enabled: true
    base: 10.0
  commands: []
dictionary:
  # Sources may be plain|URL (one phrase per line), tab|URL (entry in column one),
  # json-array|URL (JSON objects with a text property), kaikki|URL (Wiktionary JSONL),
  # or tu-dien-archive|URL (release tar.gz).
  # The 124 MB archive is streamed without saving it to disk; successful sources are cached in SQLite.
  # Only Vietnamese entries that are exactly two syllables are indexed.
  sources:
    - "plain|https://raw.githubusercontent.com/duyet/vietnamese-wordlist/master/Viet39K.txt"
    - "json-array|https://raw.githubusercontent.com/MegumiKatou02/Vietnamese-dictionary-api/main/vietnamese_words.json"
    - "tu-dien-archive|https://github.com/NhanAZ-Drops/tu-dien-tieng-viet/releases/download/v0.4.0-beta/tu-dien-tieng-viet-0.4.0-beta-documented.tar.gz"
    # Enable on demand if desired; the compressed Wiktionary extract is about 33 MB.
    # - "kaikki|https://kaikki.org/viwiktionary/raw-wiktextract-data.jsonl.gz"
  refresh-on-start: true
  request-timeout-seconds: 20
reports:
  cooldown-seconds: 30
menu:
  title: "<dark_green><bold>Nối Từ</bold></dark_green> <gray>• Menu</gray>"
streak-rewards:
  # multiplier = min(max-multiplier, 1 + bonus-per-level * log2(streak))
  bonus-per-level: 0.35
  max-multiplier: 3.0
  max-items-per-type: 64
anti-abuse:
  anti-solo: true
  minimum-reaction-delay-ms: 200
  word-use-limit: 3
  max-hard-words-in-row: 2
display:
  turn-seconds: 30
  bossbar-title: "<yellow>Nối từ • <white><word></white>"
  actionbar: "<gray>Còn <yellow><seconds></yellow> giây • Chuỗi: <gold><streak></gold>"
difficulty:
  hard-threshold: 4
  words: {}
duel:
  target-moves: 10
  default-connect-seconds: 30
  invite-expiry-seconds: 60
  max-match-seconds: 3600
